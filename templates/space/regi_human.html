{% extends 'base.html' %}
 
{% block content %}
<h2>공간에 사람 등록</h2>

<form method="POST" action="/space/human_regi" onsubmit="return confirm('이 사람을 공간에 등록하시겠습니까?');">
    <div class="form-group">
        <label for="human-name">사람 이름</label>
        <input type="text" class="form-control" id="human-name" name="human-name" placeholder="예) 홍길동" required>
    </div>
    <div class="form-group">
        <label for="human-type">사람 유형</label>
        <select class="form-control" id="human-type" name="human-type">
            <option value=1 selected>인가</option>
            <option value=0>비인가</option>
        </select>
    </div>
    <div class="form-group">
        <label for="human-photos">얼굴 사진 (최대 5장)</label>
        <input type="file" class="form-control" id="human-photos" name="human-photos" accept="image/*" capture="camera" multiple>
    </div>
    <button type="submit" class="btn btn-primary">등록</button>
</form>

<script>
    document.querySelector('form').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        const form = event.target;
        const formData = new FormData(form);
        const files = document.getElementById('human-photos').files;
        
        if (files.length > 5) {
            alert('최대 5장의 사진만 업로드할 수 있습니다.');
            return;
        }

        const base64Photos = [];
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function() {
                base64Photos.push(reader.result.split(',')[1]);
                if (base64Photos.length === files.length) {
                    formData.append('human-photos', JSON.stringify(base64Photos));
                    fetch(form.action, {
                        method: form.method,
                        body: formData
                    }).then(response => {
                        if (response.ok) {
                            alert('등록이 완료되었습니다.');
                            window.location.href = '/dashboard';
                        } else {
                            alert('등록에 실패했습니다.');
                        }
                    }).catch(error => {
                        console.error('Error:', error);
                        alert('등록 중 오류가 발생했습니다.');
                    });
                }
            };
        }
    });
</script>
{% endblock %}
